name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm build
      - run: pnpm test:dist
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm lint
      - if: runner.os == 'Linux'
        run: pnpm test:coverage
      - if: runner.os != 'Linux'
        run: pnpm test
      - name: Check committed sources through the built CLI
        run: node packages/check/dist/cli.b.js check --staged
      - name: Check the commit message
        shell: bash
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p .local
          git log -1 --format=%B "$COMMIT_SHA" > .local/commit-message
          pnpm commit-message --file .local/commit-message
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verify-${{ matrix.os }}
          path: |
            .local/reports/coverage/
          include-hidden-files: true
